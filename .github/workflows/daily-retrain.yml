# Daily ML pipeline
#
# Retrains in GitHub Actions — the free Render instance can't fit the pipeline in
# 512 MB — and publishes the results to the `models` branch, which the web app
# pulls every few hours (backend/model_sync.py). The branch is force-pushed as a
# single commit each run, so it never accumulates history.
#
# Every run is a full rebuild (a fresh checkout has no feature CSVs to append to);
# only the model registry, MLflow history and the model's paper-trading ledger carry
# over from the previous run, so the promotion gate compares against the models
# currently being served.
#
# Data-provider keys come from repo secrets (Settings → Secrets and variables →
# Actions); a missing key just skips that source.
#
# Manual trigger: Actions tab → "Daily ML Pipeline" → Run workflow → pick ticker.

name: Daily ML Pipeline

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 02:00 UTC Mon–Fri, after the US close
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker to retrain (e.g. NVDA)'
        required: true
        default: 'NVDA'
      publish:
        description: 'Publish to the models branch (off = dry run, e.g. to test a branch)'
        type: boolean
        default: true

permissions:
  contents: write           # force-push the models branch

concurrency:
  group: retrain            # runs share the models branch; never overlap
  cancel-in-progress: false

jobs:
  retrain:
    name: Retrain ${{ github.event.inputs.ticker || 'NVDA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TICKER: ${{ github.event.inputs.ticker || 'NVDA' }}
      REG: algorithms/machine_learning_algorithms/supervised/model_registry
      PIPES: algorithms/machine_learning_algorithms/data_pipelines
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      # FinBERT scores the Finnhub headlines; without it that source is unscored
      - name: Install FinBERT
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.36.2

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-ProsusAI

      - name: Restore registry and MLflow history from the models branch
        run: |
          PUBLISHED="$RUNNER_TEMP/published"
          mkdir -p "$PUBLISHED"
          if git fetch --depth 1 origin models; then
            git archive FETCH_HEAD | tar -x -C "$PUBLISHED"
            if [ -d "$PUBLISHED/$REG" ]; then cp -R "$PUBLISHED/$REG/." "$REG/"; fi
            if [ -f "$PUBLISHED/mlflow.db" ]; then cp "$PUBLISHED/mlflow.db" .; fi
            if [ -d "$PUBLISHED/paper" ]; then cp -R "$PUBLISHED/paper" .; fi
          else
            echo "No models branch yet — starting from the registry in main."
          fi

      - name: Run pipeline
        run: python algorithms/machine_learning_algorithms/orchestrator.py "$TICKER"

      # Fills yesterday's order, marks to market, places the next one from today's signal
      - name: Trade the model's paper account
        run: python scripts/paper_model_account.py "$TICKER"

      - name: Publish to the models branch
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          PUBLISHED="$RUNNER_TEMP/published"
          mkdir -p "$PUBLISHED/$REG" "$PUBLISHED/$PIPES"
          rm -rf "$PUBLISHED/$REG/$TICKER"
          cp -R "$REG/$TICKER" "$PUBLISHED/$REG/"
          cp "$PIPES/${TICKER}_features_with_regimes.csv" "$PUBLISHED/$PIPES/"
          if [ -f mlflow.db ]; then cp mlflow.db "$PUBLISHED/"; fi
          mkdir -p "$PUBLISHED/paper" && cp paper/*.json "$PUBLISHED/paper/"

          cd "$PUBLISHED"
          git init -q -b models
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "models: $TICKER $(date -u +%F)"
          # Push through the checkout's repo, which holds the workflow's credentials
          git push -q -f "$GITHUB_WORKSPACE" models:refs/heads/models
          cd "$GITHUB_WORKSPACE"
          git push -f origin models
